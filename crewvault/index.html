<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CrewVault</title>
<meta name="description" content="Keep your seafarer certificates and documents in one place: scan, sort by Flag, STCW and IMCA, track expiry dates, share by email. Works offline.">
<meta name="theme-color" content="#14232d">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{}))}</script>
<style>
/* Layout: iOS-style grouped list under a large title, sheets slide up from the bottom. */
:root{
  --bg:#f2f2f7; --card:#ffffff; --ink:#111418; --muted:#6c7681; --line:#e1e4e8; --fill:#eceef2;
  --accent:#0a7aff; --accent-ink:#ffffff; --navy:#14232d;
  --ok:#2fb350; --warn:#f08c00; --bad:#e5392f; --none:#8b95a0;
  --c-flag:#0a7aff; --c-stcw:#5e5ce6; --c-imca:#1aa6b7; --c-other:#8b95a0;
  --bar:rgba(242,242,247,.82); --shadow:0 8px 30px rgba(0,0,0,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1b1f24; --ink:#eef1f4; --muted:#98a2ad; --line:#2c323a; --fill:#262b32;
    --accent:#4da3ff; --accent-ink:#06121c; --ok:#35c759; --warn:#ffa11a; --bad:#ff6a5f; --none:#8b95a0;
    --bar:rgba(0,0,0,.78); --shadow:0 8px 30px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1b1f24; --ink:#eef1f4; --muted:#98a2ad; --line:#2c323a; --fill:#262b32;
  --accent:#4da3ff; --accent-ink:#06121c; --ok:#35c759; --warn:#ffa11a; --bad:#ff6a5f; --none:#8b95a0;
  --bar:rgba(0,0,0,.78); --shadow:0 8px 30px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 var(--font);-webkit-font-smoothing:antialiased;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg{display:block}

/* navigation bar */
#nav{position:sticky;top:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  padding-top:env(safe-area-inset-top);border-bottom:1px solid transparent;transition:border-color .2s}
#nav.scrolled{border-bottom-color:var(--line)}
#nav .bar{max-width:760px;margin:0 auto;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
#nav .mini{position:absolute;left:0;right:0;text-align:center;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
#nav.scrolled .mini{opacity:1}
.nbtn{min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--accent);font-size:17px;border-radius:10px;position:relative;z-index:1;text-decoration:none}
.nbtn:active{opacity:.5}
.nbtn svg{width:24px;height:24px}
.nright{display:flex;align-items:center}

main{max-width:760px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
h1.large{font-size:34px;line-height:1.1;letter-spacing:-.02em;margin:4px 0 12px;font-weight:700}
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:10px;top:50%;margin-top:-9px;width:18px;height:18px;color:var(--muted)}
.search input{width:100%;height:38px;border:0;border-radius:10px;background:var(--fill);padding:0 12px 0 34px;font-size:17px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}

.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;min-width:0;height:32px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#3a414a}}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#3a414a}

.meta{display:flex;align-items:center;justify-content:space-between;margin:14px 4px 8px;color:var(--muted);font-size:13px}
.meta label{display:flex;align-items:center;gap:6px}
.meta select{background:none;border:0;color:var(--accent);font-size:13px;font-weight:600;-webkit-appearance:none;appearance:none;padding:4px 2px;cursor:pointer}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer;position:relative;display:flex;flex-direction:column;
  box-shadow:0 1px 2px rgba(0,0,0,.06);-webkit-tap-highlight-color:transparent;transition:transform .12s}
.tile:active{transform:scale(.97)}
.pic{aspect-ratio:4/3;background:var(--fill);position:relative;display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.badge{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 8px;border-radius:12px;font-size:12px;font-weight:600;
  background:var(--bar);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink)}
.badge svg{width:14px;height:14px;flex:none}
.ph-ic{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:var(--card)}
.ph-ic svg{width:34px;height:34px}
.tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.r1{font-weight:600;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.r2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.3em}
.r3{font-size:12.5px;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:6px}
.r3 svg{width:15px;height:15px;flex:none}
.st-ok{color:var(--ok)} .st-warn{color:var(--warn)} .st-bad{color:var(--bad)} .st-none{color:var(--none)}
.chk{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.28);display:none;align-items:center;justify-content:center;color:transparent}
.selecting .chk{display:flex}
.tile.sel{outline:3px solid var(--accent);outline-offset:-3px}
.tile.sel .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk svg{width:14px;height:14px}

#empty{text-align:center;padding:56px 24px;color:var(--muted)}
#empty svg{width:64px;height:64px;margin:0 auto 14px;color:var(--accent);opacity:.9}
#empty h2{color:var(--ink);margin:0 0 6px;font-size:21px}
#empty p{margin:0}

#fab{position:fixed;right:calc(20px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:15}
#fab svg{width:28px;height:28px}
#fab:active{transform:scale(.94)}
#selbar{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);padding:8px calc(16px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  display:flex;justify-content:space-between;align-items:center;gap:12px}
#selbar .pill{min-height:44px;padding:0 20px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600}
#selbar .pill[disabled]{opacity:.4}
#selbar .ghost{color:var(--accent);min-height:44px;padding:0 6px;font-weight:500}

/* sheets */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:calc(100% - 24px - env(safe-area-inset-top));border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;
  animation:up .28s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow)}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px;max-height:88%}}
.sbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 6px;background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.sbar .t{font-weight:600;text-align:center;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.sbar .l{justify-self:start}.sbar .r{justify-self:end}
.sbar .nbtn{padding:0 10px}
.sbar .bold{font-weight:600}
.sbody{overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;flex:1}
.action{background:none;align-items:flex-end;padding:0 8px calc(8px + env(safe-area-inset-bottom))}
.action .sheet{background:none;box-shadow:none;border-radius:0;animation:up .25s cubic-bezier(.2,.8,.2,1);gap:8px;overflow:visible;max-width:520px}
.action .grp{background:var(--card);border-radius:14px;overflow:hidden}
.action .grp button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;color:var(--accent);font-size:19px;border-top:1px solid var(--line)}
.action .grp button:first-child{border-top:0}
.action .grp button svg{width:22px;height:22px}
.action .grp button:active{background:var(--fill)}
.action .grp.cancel button{font-weight:600}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* editor */
.pv{background:var(--card);border-radius:12px;min-height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;border:1px solid var(--line)}
.pv img{max-height:46vh;max-width:100%;object-fit:contain;display:block}
.pv .ph{text-align:center;color:var(--muted);padding:34px 16px}
.pv .ph svg{width:44px;height:44px;margin:0 auto 8px}
.pv .busy{position:absolute;inset:0;background:var(--bar);display:flex;align-items:center;justify-content:center;font-weight:600}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 2px;align-items:center}
.pt{width:52px;height:64px;border-radius:8px;border:2px solid transparent;overflow:hidden;flex:none;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;font-weight:700}
.pt img{width:100%;height:100%;object-fit:cover}
.pt[aria-current="true"]{border-color:var(--accent)}
.addp{width:52px;height:64px;border-radius:8px;border:2px dashed var(--line);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.addp svg{width:22px;height:22px}
.ctrl{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.ctrl .seg{flex:1}
.ibtn{min-width:44px;height:36px;border-radius:9px;background:var(--fill);color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0 10px;gap:6px;font-size:14px;font-weight:600}
.ibtn svg{width:20px;height:20px}
.ibtn.danger{color:var(--bad)}
.form{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:16px}
.f{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;position:relative}
.f+.f::before{content:"";position:absolute;left:14px;right:0;top:0;height:1px;background:var(--line)}
.f>label{width:104px;flex:none;color:var(--ink);font-size:16px}
.f input[type=text],.f input[type=date],.f select,.f textarea{flex:1;min-width:0;border:0;background:none;font-size:17px;text-align:right;height:44px;-webkit-appearance:none;appearance:none;color:var(--ink)}
.f input[type=date]{text-align:right;color:var(--ink)}
.f input[type=date]:disabled{opacity:.35}
.f input::placeholder,.f textarea::placeholder{color:var(--muted)}
.f input:focus-visible,.f select:focus-visible,.f textarea:focus-visible{outline:none}
.f textarea{height:auto;min-height:72px;padding:11px 0;resize:none;text-align:left;font-size:16px}
.f.area{align-items:flex-start;flex-direction:column;gap:0;padding-top:6px}
.f.area textarea{width:100%}
.f .sw{flex:1;display:flex;justify-content:flex-end}
.toggle{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.toggle[aria-checked="true"]{background:var(--ok)}
.toggle[aria-checked="true"]::after{transform:translateX(20px)}
.btnrow{display:flex;gap:10px;margin-bottom:12px}
.big{flex:1;min-height:48px;border-radius:12px;background:var(--card);color:var(--accent);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.big.danger{color:var(--bad)}
.big svg{width:20px;height:20px}
.note{color:var(--muted);font-size:13px;margin:6px 6px 16px}
.hd{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin:18px 6px 6px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,34,40,.94);color:#fff;border-radius:22px;padding:10px 18px;font-size:15px;z-index:60;max-width:88vw;text-align:center;animation:fade .2s}

/* printable list (hidden on screen) */
#printArea{display:none}
@media print{
  body>:not(#printArea){display:none!important}
  #printArea{display:block;color:#000;background:#fff;font:12px/1.35 var(--font);padding:0}
  #printArea h1{font-size:20px;margin:0 0 2px}
  #printArea .sub{color:#555;margin:0 0 14px;font-size:11px}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#555;border-bottom:1.5px solid #000;padding:4px 6px}
  #printArea td{padding:6px;border-bottom:.5px solid #bbb;vertical-align:top}
  #printArea tr{break-inside:avoid}
  #printArea .bad{color:#b00020;font-weight:700} #printArea .warn{color:#a35a00;font-weight:700}
  @page{margin:14mm}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="nav">
  <div class="bar">
    <a class="nbtn" href="../" id="back" aria-label="Apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span data-i="apps">Apps</span></a>
    <div class="mini">CrewVault</div>
    <div class="nright">
      <button class="nbtn" id="bSelect" data-i="select">Select</button>
      <button class="nbtn" id="bPrint" aria-label="Print"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V3h10v6M7 18H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="7" y="14" width="10" height="7" rx="1"/></svg></button>
      <button class="nbtn" id="bSet" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
    </div>
  </div>
</header>

<main id="main">
  <h1 class="large" data-i="documents">Documents</h1>
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" data-iph="search" placeholder="Search" autocomplete="off"></div>
  <div class="seg" id="seg" role="group"></div>
  <div class="meta"><span id="count"></span><label><span data-i="sort">Sort</span><select id="sort"></select></label></div>
  <div class="tiles" id="list"></div>
  <div id="empty" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
    <h2 data-i="emptyTitle">No documents yet</h2>
    <p data-i="emptyText">Tap + to scan your first certificate.</p>
  </div>
</main>

<button id="fab" aria-label="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="selbar" hidden>
  <button class="ghost" id="selAll" data-i="selAll">Select all</button>
  <button class="pill" id="selShare" disabled>Share</button>
</div>
<div id="printArea"></div>
<input type="file" id="inCam" accept="image/*" capture="environment" hidden>
<input type="file" id="inFile" accept="image/*,application/pdf" multiple hidden>
<input type="file" id="inBackup" accept="application/json,.json" hidden>

const MS_DAY = 864e5;

function status(d) {
  if (d.noExpiry) return { cls: "none", txt: t("st_none"), rank: 4 };
  const n = daysLeft(d.expiry);
  if (n === null) return { cls: "none", txt: t("st_nodate"), rank: 5 };
  if (n < 0) return { cls: "bad", txt: t("st_expired", { n: -n }), rank: 0, n };
  if (n === 0) return { cls: "bad", txt: t("st_expired1"), rank: 0, n };
  if (n <= 90) return { cls: "warn", txt: t("st_soon", { n }), rank: 1, n };

}

/* ---------- storage (IndexedDB) ---------- */
let dbp = null, mem = new Map(); // mem = fallback if IndexedDB is blocked
function openDB() {
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open("crewvault", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("docs", { keyPath: "id" });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  }).catch(() => null);
  return dbp;
}
async function dbAll() {
  const db = await openDB(); if (!db) return [...mem.values()];
  return new Promise((res, rej) => { const q = db.transaction("docs").objectStore("docs").getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function dbPut(doc) {
  const db = await openDB(); if (!db) { mem.set(doc.id, doc); return; }
  return new Promise((res, rej) => { const tx = db.transaction("docs", "readwrite"); tx.objectStore("docs").put(doc); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}
async function dbDel(id) {
  const db = await openDB(); if (!db) { mem.delete(id); return; }
  return new Promise((res, rej) => { const tx = db.transaction("docs", "readwrite"); tx.objectStore("docs").delete(id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}

const MAXD = 2200;

}
function applyFilter(ctx, w, h, mode) {
  const img = ctx.getImageData(0, 0, w, h), d = img.data, n = w * h;

    for (let y = 0; y < h; y++) {
      const y0 = Math.max(0, y - half), y1 = Math.min(h - 1, y + half);
      for (let x = 0; x < w; x++) {
        const x0 = Math.max(0, x - half), x1 = Math.min(w - 1, x + half), area = (x1 - x0 + 1) * (y1 - y0 + 1);
        const sum = I[(y1 + 1) * W1 + x1 + 1] - I[y0 * W1 + x1 + 1] - I[(y1 + 1) * W1 + x0] + I[y0 * W1 + x0];
        const v = lum[y * w + x] * area < sum * 0.9 ? 0 : 255, j = (y * w + x) * 4;
        d[j] = d[j + 1] = d[j + 2] = v;
      }
    }

    // stretch levels so paper becomes white and ink stays dark
    let c = 0, lo = 0, hi = 255; const a = n * 0.01, b = n * 0.9;
    for (let v = 0; v < 256; v++) { c += hist[v]; if (c >= a) { lo = v; break; } }
    c = 0; for (let v = 0; v < 256; v++) { c += hist[v]; if (c >= b) { hi = v; break; } }
    if (hi - lo < 30) hi = Math.min(255, lo + 30);
    const g = 255 / (hi - lo), gray = mode === "gray";
    for (let i = 0, j = 0; i < n; i++, j += 4) {
      if (gray) { const v = Math.max(0, Math.min(255, (lum[i] - lo) * g)); d[j] = d[j + 1] = d[j + 2] = v; }
      else for (let k = 0; k < 3; k++) d[j + k] = Math.max(0, Math.min(255, (d[j + k] - lo) * g));
    }
  }
  ctx.putImageData(img, 0, 0);
}

  c.width = Math.max(1, Math.round(cv.width * s)); c.height = Math.max(1, Math.round(cv.height * s));

  return c.toDataURL("image/jpeg", 0.7);
}
async function renderPage(p) {
  const sw = p.src.naturalWidth || p.src.width, sh = p.src.naturalHeight || p.src.height, k = Math.min(1, MAXD / Math.max(sw, sh));
  const w = Math.round(sw * k), h = Math.round(sh * k), rot = p.rot % 360, swap = rot === 90 || rot === 270;
  const cv = document.createElement("canvas"); cv.width = swap ? h : w; cv.height = swap ? w : h;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.translate(cv.width / 2, cv.height / 2); ctx.rotate(rot * Math.PI / 180); ctx.drawImage(p.src, -w / 2, -h / 2, w, h);
  ctx.setTransform(1, 0, 0, 1, 0, 0);

function visibleDocs() {

    (!q || [d.name, d.number, d.issuer, d.notes, catName(d.cat)].join(" ").toLowerCase().includes(q)));
  const cmpName = (a, b) => (a.name || "").localeCompare(b.name || "");
  const order = { flag: 0, stcw: 1, imca: 2, other: 3 };
  const sorters = {
    expiry: (a, b) => { const A = a.noExpiry || !a.expiry ? "9999" : a.expiry, B = b.noExpiry || !b.expiry ? "9999" : b.expiry; return A.localeCompare(B) || cmpName(a, b); },
    name: cmpName,
    cat: (a, b) => (order[a.cat] - order[b.cat]) || cmpName(a, b),
    issuer: (a, b) => (a.issuer || "￿").localeCompare(b.issuer || "￿") || cmpName(a, b),

const sheetStack = [];
function openSheet({ title, left, right, body, onClose, action }) {
  const ov = document.createElement("div"); ov.className = "overlay" + (action ? " action" : "");
  const sh = document.createElement("div"); sh.className = "sheet"; ov.appendChild(sh);
  const api = { el: sh, body: null, close() { ov.remove(); const i = sheetStack.indexOf(api); if (i >= 0) sheetStack.splice(i, 1); }, ov };
  if (!action) {

    const mk = (cfg, cls) => { const w = document.createElement("div"); w.className = cls; if (cfg) { const b = document.createElement("button"); b.className = "nbtn" + (cfg.bold ? " bold" : ""); b.textContent = cfg.text; b.onclick = cfg.fn; w.appendChild(b); } return w; };

    bar.append(mk(left, "l"), ttl, mk(right, "r")); sh.appendChild(bar);
    api.body = document.createElement("div"); api.body.className = "sbody"; sh.appendChild(api.body); api.title = ttl; api.bar = bar;

};

async function openEditor(doc, startFiles = []) {
  const isNew = !doc;
  const ed = {
    id: doc ? doc.id : uid(), created: doc ? doc.created : Date.now(), cur: 0, busy: false, dirty: isNew, catTouched: !isNew,
    pages: (doc ? doc.pages : []).map(p => ({ blob: p.blob, type: p.type, thumb: p.thumb, url: URL.createObjectURL(p.blob) }))
  };
  const free = () => ed.pages.forEach(p => { if (p.url) URL.revokeObjectURL(p.url); });
  const doClose = () => { free(); sh.close(); };
  const tryClose = () => { if (ed.dirty) confirmSheet(t("discard"), t("discardYes"), doClose, t("keep")); else doClose(); };

  const sh = openSheet({
    title: isNew ? t("newDoc") : t("docTitle"), left: { text: t("cancel"), fn: () => tryClose() }, right: { text: t("save"), fn: () => save(), bold: true }, onClose: () => tryClose(),
    body: api => {
      api.body.innerHTML =
        `<div class="pv" id="edPv"></div><div class="strip" id="edStrip"></div><div class="ctrl" id="edCtrl"></div>` +
        `<div class="form">` +
        `<div class="f"><label for="eName">${esc(t("f_name"))}</label><input id="eName" type="text" list="eHints" placeholder="${esc(t("namePh"))}" autocomplete="off" autocapitalize="sentences"><datalist id="eHints">${NAME_HINTS.map(h => `<option value="${esc(h)}">`).join("")}</datalist></div>` +
        `<div class="f"><label for="eCat">${esc(t("f_cat"))}</label><select id="eCat">${CATS.map(c => `<option value="${c.id}">${esc(catName(c.id))}</option>`).join("")}</select></div>` +
        `<div class="f"><label for="eNum">${esc(t("f_number"))}</label><input id="eNum" type="text" placeholder="${esc(t("optional"))}" autocomplete="off" autocapitalize="characters"></div>` +
        `<div class="f"><label for="eIss">${esc(t("f_issued"))}</label><input id="eIss" type="date"></div>` +
        `<div class="f"><label for="eExp">${esc(t("f_expiry"))}</label><input id="eExp" type="date"></div>` +
        `<div class="f"><label id="lNoExp">${esc(t("f_noexp"))}</label><div class="sw"><button class="toggle" id="eNoExp" role="switch" aria-checked="false" aria-labelledby="lNoExp"></button></div></div>` +
        `<div class="f"><label for="eBy">${esc(t("f_issuer"))}</label><input id="eBy" type="text" placeholder="${esc(t("optional"))}" autocomplete="off"></div>` +
        `<div class="f area"><label for="eNotes" style="width:auto">${esc(t("f_notes"))}</label><textarea id="eNotes" rows="3" placeholder="${esc(t("notesPh"))}"></textarea></div>` +
        `</div><div class="btnrow" id="edBtns"></div>`;
    }
  });
  const q = s => sh.body.querySelector(s);
  if (doc) {
    q("#eName").value = doc.name || ""; q("#eCat").value = doc.cat || "other"; q("#eNum").value = doc.number || ""; q("#eIss").value = doc.issued || "";
    q("#eExp").value = doc.expiry || ""; q("#eBy").value = doc.issuer || ""; q("#eNotes").value = doc.notes || "";
    if (doc.noExpiry) { q("#eNoExp").setAttribute("aria-checked", "true"); q("#eExp").disabled = true; }
  } else q("#eCat").value = "other";
  sh.body.addEventListener("input", () => { ed.dirty = true; });
  q("#eName").addEventListener("input", e => { if (!ed.catTouched) q("#eCat").value = suggestCat(e.target.value); });
  q("#eCat").addEventListener("change", () => { ed.catTouched = true; });
  q("#eNoExp").onclick = e => { const on = e.currentTarget.getAttribute("aria-checked") !== "true"; e.currentTarget.setAttribute("aria-checked", String(on)); q("#eExp").disabled = on; ed.dirty = true; };

  function drawPages() {
    const pv = q("#edPv"), strip = q("#edStrip"), ctrl = q("#edCtrl"), p = ed.pages[ed.cur];
    pv.innerHTML = "";
    if (!p) pv.innerHTML = `<div class="ph">${SVG.image}<div>${esc(t("noScan"))}</div></div>`;
    else if (p.type === "application/pdf") { pv.innerHTML = `<div class="ph">${ICON_DOC.replace("<svg", '<svg style="width:44px;height:44px;margin:0 auto 8px"')}<div>${esc(t("pdfFile"))}</div></div>`; }
    else { const im = new Image(); im.alt = ""; im.src = p.url; pv.appendChild(im); }
    if (ed.busy) { const b = document.createElement("div"); b.className = "busy"; b.textContent = t("processing"); pv.appendChild(b); }
    strip.innerHTML = "";
    ed.pages.forEach((pg, i) => {
      const b = document.createElement("button"); b.className = "pt"; b.setAttribute("aria-current", String(i === ed.cur)); b.setAttribute("aria-label", t("page") + " " + (i + 1));
      b.innerHTML = pg.thumb ? `<img alt="" src="${pg.thumb}">` : "PDF"; b.onclick = () => { ed.cur = i; drawPages(); }; strip.appendChild(b);
    });
    const add = document.createElement("button"); add.className = "addp"; add.setAttribute("aria-label", t("addPage")); add.innerHTML = SVG.plus;
    add.onclick = () => actionSheet([{ icon: ICON_CAM, text: t("takePhoto"), fn: async () => addFiles(await pick("cam")) }, { icon: ICON_IMG, text: t("chooseFile"), fn: async () => addFiles(await pick("file")) }]);
    strip.appendChild(add);
    ctrl.innerHTML = ""; ctrl.hidden = !(p && p.src);
    if (p && p.src) {
      const seg = document.createElement("div"); seg.className = "seg";
      [["color", "m_color"], ["gray", "m_gray"], ["bw", "m_bw"], ["orig", "m_orig"]].forEach(([m, k]) => {
        const b = document.createElement("button"); b.textContent = t(k); b.setAttribute("aria-pressed", String(p.mode === m));
        b.onclick = async () => { if (ed.busy) return; p.mode = m; ed.dirty = true; await rerender(p); }; seg.appendChild(b);
      });
      const rot = document.createElement("button"); rot.className = "ibtn"; rot.setAttribute("aria-label", t("rotate")); rot.innerHTML = SVG.rot;
      rot.onclick = async () => { if (ed.busy) return; p.rot = (p.rot + 90) % 360; ed.dirty = true; await rerender(p); };
      ctrl.append(seg, rot);
    }
    const btns = q("#edBtns"); btns.innerHTML = "";
    if (p) { const rm = document.createElement("button"); rm.className = "big danger"; rm.innerHTML = SVG.trash + esc(t("removePage"));
      rm.onclick = () => { if (p.url) URL.revokeObjectURL(p.url); ed.pages.splice(ed.cur, 1); ed.cur = Math.max(0, ed.cur - 1); ed.dirty = true; drawPages(); }; btns.appendChild(rm); }
    if (p && p.type === "application/pdf") { const op = document.createElement("button"); op.className = "big"; op.textContent = t("openPdf"); op.onclick = () => window.open(p.url, "_blank"); btns.appendChild(op); }
    if (!isNew) {
      const shb = document.createElement("button"); shb.className = "big"; shb.innerHTML = SVG.share + esc(t("share")); shb.onclick = () => shareDocs([doc.id]); btns.appendChild(shb);
      const del = document.createElement("button"); del.className = "big danger"; del.innerHTML = SVG.trash + esc(t("delete"));
      del.onclick = () => confirmSheet(t("confirmDelete"), t("confirmYes"), async () => { await dbDel(doc.id); docs = docs.filter(x => x.id !== doc.id); selected.delete(doc.id); doClose(); render(); toast(t("deleted")); }); btns.appendChild(del);
    }
  }
  async function rerender(p) { ed.busy = true; drawPages(); try { await renderPage(p); } finally { ed.busy = false; drawPages(); } }
  async function addFiles(files) {
    if (!files.length) return; ed.busy = true; ed.dirty = true; drawPages();
    for (const f of files) {
      try {
        if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) ed.pages.push({ blob: f, type: "application/pdf", thumb: null, url: URL.createObjectURL(f) });
        else { const p = { src: await loadImage(f), mode: "color", rot: 0 }; await renderPage(p); ed.pages.push(p); }
        ed.cur = ed.pages.length - 1;
      } catch (e) { console.error(e); }
    }
    ed.busy = false; drawPages();
  }
  async function save() {
    const name = q("#eName").value.trim();
    if (!name) { toast(t("nameRequired")); q("#eName").focus(); return; }
    if (ed.busy) return;
    const noExp = q("#eNoExp").getAttribute("aria-checked") === "true";
    const out = {
      id: ed.id, created: ed.created, updated: Date.now(), name, cat: q("#eCat").value, number: q("#eNum").value.trim(), issued: q("#eIss").value,
      expiry: noExp ? "" : q("#eExp").value, noExpiry: noExp, issuer: q("#eBy").value.trim(), notes: q("#eNotes").value.trim(),
      pages: ed.pages.map(p => ({ blob: p.blob, type: p.type, thumb: p.thumb || null })), thumb: (ed.pages[0] && ed.pages[0].thumb) || null
    };
    await dbPut(out);
    const i = docs.findIndex(d => d.id === out.id); if (i >= 0) docs[i] = out; else docs.push(out);
    doClose(); render(); toast(t("saved"));
  }
  drawPages();
  if (startFiles.length) await addFiles(startFiles);
}

/* ---------- share / download ---------- */
const slug = s => (s || "document").replace(/[^\w\-. ]+/g, "").trim().replace(/\s+/g, "_").slice(0, 60) || "document";
const extOf = type => type === "application/pdf" ? "pdf" : "jpg";
function filesOf(ids) {
  const out = [];
  for (const id of ids) {
    const d = docs.find(x => x.id === id); if (!d) continue;
    d.pages.forEach((p, i) => out.push(new File([p.blob], slug(d.name + (d.number ? "_" + d.number : "")) + (d.pages.length > 1 ? "_p" + (i + 1) : "") + "." + extOf(p.type), { type: p.type })));
  }
  return out;
}
async function download(files) {
  for (const f of files) { const u = URL.createObjectURL(f), a = document.createElement("a"); a.href = u; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); await sleep(350); }
}
async function shareFiles(files, title) {
  if (!files.length) { toast(t("nothing")); return; }
  try {
    if (navigator.canShare && navigator.canShare({ files })) { await navigator.share({ files, title }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  await download(files); toast(t("shareFail"));
}
const shareDocs = ids => shareFiles(filesOf(ids), "CrewVault");

/* ---------- print / PDF list ---------- */
function printList() {
  const list = visibleDocs(), pa = $("#printArea");
  pa.innerHTML = `<h1>${esc(t("printTitle"))}</h1><p class="sub">${esc(t("printed"))}: ${esc(new Date().toLocaleDateString(getLang() === "pl" ? "pl-PL" : "en-GB", { day: "2-digit", month: "long", year: "numeric" }))} · ${list.length}</p>` +
    `<table><thead><tr><th>${esc(t("c_cat"))}</th><th>${esc(t("c_doc"))}</th><th>${esc(t("c_no"))}</th><th>${esc(t("c_issued"))}</th><th>${esc(t("c_exp"))}</th><th>${esc(t("c_by"))}</th><th>${esc(t("c_status"))}</th></tr></thead><tbody>` +
    list.map(d => { const st = status(d); return `<tr><td>${esc(catName(d.cat))}</td><td>${esc(d.name)}</td><td>${esc(d.number)}</td><td>${esc(fmtDate(d.issued))}</td><td>${d.noExpiry ? "—" : esc(fmtDate(d.expiry))}</td><td>${esc(d.issuer)}</td><td class="${st.cls === "bad" ? "bad" : st.cls === "warn" ? "warn" : ""}">${esc(st.txt)}</td></tr>`; }).join("") +
    `</tbody></table>`;
  setTimeout(() => window.print(), 50);
}

/* ---------- settings & backup ---------- */
const blobToData = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function exportBackup() {
  const items = [];
  for (const d of docs) items.push({ ...d, pages: await Promise.all(d.pages.map(async p => ({ type: p.type, thumb: p.thumb, data: await blobToData(p.blob) }))) });
  const file = new File([JSON.stringify({ app: "crewvault", v: 1, docs: items })], "CrewVault-backup-" + new Date().toISOString().slice(0, 10) + ".json", { type: "application/json" });
  await shareFiles([file], "CrewVault backup");
}
async function importBackup(file) {
  try {
    const j = JSON.parse(await file.text()); if (j.app !== "crewvault" || !Array.isArray(j.docs)) throw 0;
    for (const d of j.docs) {
      const pages = await Promise.all(d.pages.map(async p => ({ type: p.type, thumb: p.thumb, blob: await (await fetch(p.data)).blob() })));
      const doc = { ...d, pages }; await dbPut(doc); const i = docs.findIndex(x => x.id === doc.id); if (i >= 0) docs[i] = doc; else docs.push(doc);
    }
    render(); toast(t("imported", { n: j.docs.length }));
  } catch (e) { toast(t("importFail")); }
}
function openSettings() {
  const sh = openSheet({ title: t("settings"), right: { text: t("done"), fn: () => sh.close(), bold: true }, body: api => {
    const cur = lsGet("crewvault.lang") || "auto";
    api.body.innerHTML =
      `<div class="hd">${esc(t("language"))}</div><div class="seg" id="sLang">${[["auto", t("auto")], ["en", "English"], ["pl", "Polski"]].map(([v, n]) => `<button data-v="${v}" aria-pressed="${cur === v}">${esc(n)}</button>`).join("")}</div>` +
      `<div class="hd">${esc(t("backup"))}</div><div class="btnrow"><button class="big" id="sExp">${esc(t("exportBackup"))}</button><button class="big" id="sImp">${esc(t("importBackup"))}</button></div><div class="note">${esc(t("backupNote"))}</div>` +
      `<div class="hd">${esc(t("privacy"))}</div><div class="note" style="margin-top:0">${esc(t("privacyText"))}</div>` +
      `<div class="hd">${esc(t("storage"))}</div><div class="note" style="margin-top:0">${esc(t("storageText", { n: docs.length }))}</div>`;
    api.body.querySelectorAll("#sLang button").forEach(b => b.onclick = () => { lsSet("crewvault.lang", b.dataset.v); api.close(); render(); openSettings(); });
    api.body.querySelector("#sExp").onclick = () => exportBackup();
    api.body.querySelector("#sImp").onclick = () => { const i = $("#inBackup"); i.value = ""; i.onchange = () => i.files[0] && importBackup(i.files[0]); i.click(); };
  }});
}

/* ---------- wire up ---------- */
$("#fab").onclick = addMenu;
$("#q").addEventListener("input", e => { query = e.target.value; render(); });
$("#sort").addEventListener("change", e => { sortBy = e.target.value; lsSet("crewvault.sort", sortBy); render(); });
$("#bSelect").onclick = () => { selecting = !selecting; selected.clear(); render(); };
$("#selAll").onclick = () => { const l = visibleDocs(); if (selected.size === l.length) selected.clear(); else l.forEach(d => selected.add(d.id)); render(); };
$("#selShare").onclick = () => shareDocs([...selected]);
$("#bPrint").onclick = printList;
$("#bSet").onclick = openSettings;
addEventListener("scroll", () => $("#nav").classList.toggle("scrolled", scrollY > 38), { passive: true });
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheetStack.length) sheetStack[sheetStack.length - 1].ov.dispatchEvent(new MouseEvent("mousedown", { bubbles: false })); });
(async () => {
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  try { docs = await dbAll(); } catch (e) { docs = []; }
  render();
})();
</script>
