<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CrewVault</title>
<meta name="description" content="Keep your seafarer certificates and documents in one place: scan, sort by Flag, STCW and IMCA, track expiry dates, share by email. Works offline.">
<meta name="theme-color" content="#0c9786">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{}))}</script>
<style>
/* Layout: iOS-style grouped list under a large title, sheets slide up from the bottom. */
:root{--bg:#f3f3f1;--card:#ffffff;--ink:#151719;--muted:#6a7075;--line:#e4e4e0;--fill:#ececE8;--accent:#0c9786;--accent-ink:#ffffff;--bar:rgba(243,243,241,.82);--shadow:0 12px 36px rgba(0,0,0,.18);--tshadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.06);--tshadow-hi:0 14px 34px rgba(0,0,0,.14);--navy:#14232d;--ok:#17a673;--warn:#e98f00;--bad:#e5392f;--none:#7c8da0;--c-flag:#1d5cff;--c-stcw:#0b9c9c;--c-imca:#7a5af8;--c-other:#7c8da0;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0e0f;--card:#171a1c;--ink:#ededeb;--muted:#9aa0a5;--line:#26292c;--fill:#212528;--accent:#2fd0b9;--accent-ink:#04201b;--bar:rgba(12,14,15,.78);--shadow:0 12px 36px rgba(0,0,0,.6);--tshadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);--tshadow-hi:0 16px 38px rgba(0,0,0,.55);--ok:#2fd39a;--warn:#ffb340;--bad:#ff6a5f;--none:#7c8da0;--c-flag:#5b92ff;--c-stcw:#2cc7c7;--c-imca:#a08cff;--c-other:#8b9bad;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0c0e0f;--card:#171a1c;--ink:#ededeb;--muted:#9aa0a5;--line:#26292c;--fill:#212528;--accent:#2fd0b9;--accent-ink:#04201b;--bar:rgba(12,14,15,.78);--shadow:0 12px 36px rgba(0,0,0,.6);--tshadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);--tshadow-hi:0 16px 38px rgba(0,0,0,.55);--ok:#2fd39a;--warn:#ffb340;--bad:#ff6a5f;--none:#7c8da0;--c-flag:#5b92ff;--c-stcw:#2cc7c7;--c-imca:#a08cff;--c-other:#8b9bad;color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 420px at 8% -8%,color-mix(in srgb,var(--accent) 13%,transparent),transparent),var(--bg);color:var(--ink);font:17px/1.35 var(--font);-webkit-font-smoothing:antialiased;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg{display:block}

/* navigation bar */
#nav{position:sticky;top:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  padding-top:env(safe-area-inset-top);border-bottom:1px solid transparent;transition:border-color .2s}
#nav.scrolled{border-bottom-color:var(--line)}
#nav .bar{max-width:1500px;margin:0 auto;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
#nav .mini{position:absolute;left:0;right:0;text-align:center;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
#nav.scrolled .mini{opacity:1}
.nbtn{min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--accent);font-size:17px;border-radius:10px;position:relative;z-index:1;text-decoration:none}
.nbtn:active{opacity:.5}
.nbtn svg{width:24px;height:24px}
.nright{display:flex;align-items:center;margin-left:auto}

main{max-width:1500px;margin:0 auto;padding:0 clamp(12px,2.2vw,32px) calc(110px + env(safe-area-inset-bottom))}
h1.large{font-size:32px;line-height:1.1;letter-spacing:-.02em;margin:2px 0 10px;font-weight:700}
.toolbar{display:flex;gap:8px;align-items:center;margin:0 0 10px}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:10px;top:50%;margin-top:-9px;width:18px;height:18px;color:var(--muted)}
.search input{width:100%;height:40px;border:0;border-radius:12px;background:var(--fill);padding:0 12px 0 34px;font-size:17px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}

.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;min-width:0;height:32px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#3a414a}}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#3a414a}

.pill{height:40px;border-radius:12px;background:var(--fill);display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--accent);font-weight:600;font-size:13.5px;flex:none;max-width:44vw}
.pill svg{width:18px;height:18px;flex:none}
.pill select{background:none;border:0;color:inherit;font:inherit;-webkit-appearance:none;appearance:none;cursor:pointer;min-width:0;max-width:130px;text-overflow:ellipsis;padding:0}
button.pill{width:40px;justify-content:center;padding:0}
@media (max-width:420px){.pill select{max-width:92px}}

.groups .badge{display:none}
.dense .tiles{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:9px}
.dense .tile{border-radius:16px}
.dense .r2,.dense .r3,.dense .vbar{display:none}
.dense .tx{padding:8px 10px 10px}
.dense .r1{font-size:13px;min-height:0}
.dense .days b{font-size:19px}.dense .days small{font-size:10.5px}
.dense .sp{width:24px;height:24px;right:8px;bottom:8px}.dense .sp svg{width:14px;height:14px}
.dense .days{left:9px;bottom:8px}
.dense .badge{display:none}
.groups{display:flex;flex-direction:column;gap:20px}
@media (min-width:1100px){.groups{display:block;column-count:2;column-gap:30px}.groups section{break-inside:avoid;margin-bottom:22px}}
.sh{display:flex;align-items:center;gap:9px;margin:0 2px 9px}
.sh .si{display:flex;width:30px;height:30px;border-radius:10px;align-items:center;justify-content:center;background:color-mix(in srgb,var(--cc) 16%,transparent);color:var(--cc)}
.sh .si svg{width:18px;height:18px}
.sh h2{font-size:19px;letter-spacing:-.01em;margin:0;font-weight:700}
.sh em{font-style:normal;color:var(--muted);font-weight:600;font-size:14px}
.sh .sd{display:flex;gap:8px;margin-left:4px}
.sh .sd span{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--sc)}
.sh .sd span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sc)}
.sh .more{margin-left:auto;color:var(--accent);font-weight:600;font-size:14px;min-height:36px;padding:0 4px;white-space:nowrap}
.sub{color:var(--muted);font-size:14px;margin:-2px 0 10px}
.sub b{color:var(--ink);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 10px;max-width:560px}
.stat{background:var(--card);border-radius:16px;padding:9px 12px;text-align:left;display:flex;align-items:center;gap:10px;box-shadow:var(--tshadow);border:2px solid transparent;transition:transform .12s,border-color .15s}
.stat:active{transform:scale(.97)}
.stat b{font-size:24px;line-height:1;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:500}
.stat span i{width:8px;height:8px;border-radius:50%;background:var(--sc);flex:none}
.stat[aria-pressed="true"]{border-color:var(--sc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px 0 11px;border-radius:19px;background:var(--card);display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px;box-shadow:var(--tshadow);color:var(--ink)}
.chip svg{width:17px;height:17px;color:var(--cc,var(--muted))}
.chip em{font-style:normal;font-size:12px;color:var(--muted);font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] svg{color:inherit}
.chip[aria-pressed="true"] em{color:inherit;opacity:.7}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;background:var(--card);border-radius:22px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--tshadow);
  -webkit-tap-highlight-color:transparent;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s}
@media (hover:hover){.tile:hover{transform:translateY(-3px);box-shadow:var(--tshadow-hi)}}
.tile:active{transform:scale(.97)}
.pic{aspect-ratio:1/1;position:relative;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--cc) 26%,var(--fill)),var(--fill));display:flex;align-items:center;justify-content:center}
.pic img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.pic::after{content:"";position:absolute;left:0;right:0;bottom:0;height:48%;background:linear-gradient(to top,rgba(5,12,20,.72),transparent);pointer-events:none}
.ph-ic{width:68px;height:68px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:var(--card);box-shadow:var(--tshadow);margin-bottom:26px}
.ph-ic svg{width:34px;height:34px}
.badge{position:absolute;left:10px;top:10px;z-index:2;display:flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 8px;border-radius:13px;font-size:12px;font-weight:700;
  background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--ink)}
.badge svg{width:14px;height:14px}
.days{position:absolute;left:12px;bottom:11px;z-index:2;color:#fff;line-height:1;display:flex;flex-direction:column;gap:3px}
.days b{font-size:24px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.days small{font-size:12px;font-weight:600;opacity:.88}
.sp{position:absolute;right:11px;bottom:11px;z-index:2;width:32px;height:32px;border-radius:50%;background:var(--sc);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.sp svg{width:18px;height:18px}
.tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.r1{font-weight:650;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.r2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.3em}
.vbar{height:5px;border-radius:3px;background:var(--fill);margin-top:7px;overflow:hidden}
.vbar i{display:block;height:100%;border-radius:3px;background:var(--sc)}
.r3{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.chk{position:absolute;right:10px;top:10px;z-index:3;width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;color:transparent}
.selecting .chk{display:flex}
.tile.sel{outline:3px solid var(--accent);outline-offset:-3px}
.tile.sel .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk svg{width:15px;height:15px}
#empty{text-align:center;padding:56px 24px;color:var(--muted)}
#empty svg{width:64px;height:64px;margin:0 auto 14px;color:var(--accent);opacity:.9}
#empty h2{color:var(--ink);margin:0 0 6px;font-size:21px}
#empty p{margin:0}

#fab{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));height:56px;padding:0 22px 0 16px;border-radius:28px;
  background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000));color:var(--accent-ink);display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;box-shadow:var(--shadow);z-index:15}
#fab svg{width:24px;height:24px}
#fab:active{transform:scale(.95)}
#selbar{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);padding:8px calc(16px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  display:flex;justify-content:space-between;align-items:center;gap:12px}
#selbar .pill{min-height:44px;padding:0 20px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600}
#selbar .pill[disabled]{opacity:.4}
#selbar .ghost{color:var(--accent);min-height:44px;padding:0 6px;font-weight:500}

/* sheets */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:calc(100% - 24px - env(safe-area-inset-top));border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;
  animation:up .28s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow)}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px;max-height:88%}}
.sbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 6px;background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.sbar .t{font-weight:600;text-align:center;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.sbar .l{justify-self:start}.sbar .r{justify-self:end}
.sbar .nbtn{padding:0 10px}
.sbar .bold{font-weight:600}
.sbody{overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;flex:1}
.action{background:none;align-items:flex-end;padding:0 8px calc(8px + env(safe-area-inset-bottom))}
.action .sheet{background:none;box-shadow:none;border-radius:0;animation:up .25s cubic-bezier(.2,.8,.2,1);gap:8px;overflow:visible;max-width:520px}
.action .grp{background:var(--card);border-radius:14px;overflow:hidden}
.action .grp button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;color:var(--accent);font-size:19px;border-top:1px solid var(--line)}
.action .grp button:first-child{border-top:0}
.action .grp button svg{width:22px;height:22px}
.action .grp button:active{background:var(--fill)}
.action .grp.cancel button{font-weight:600}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* editor */
.pv{background:var(--card);border-radius:12px;min-height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;border:1px solid var(--line)}
.pv img{max-height:46vh;max-width:100%;object-fit:contain;display:block}
.pv .ph{text-align:center;color:var(--muted);padding:34px 16px}
.pv .ph svg{width:44px;height:44px;margin:0 auto 8px}
.pv .busy{position:absolute;inset:0;background:var(--bar);display:flex;align-items:center;justify-content:center;font-weight:600}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 2px;align-items:center}
.pt{width:52px;height:64px;border-radius:8px;border:2px solid transparent;overflow:hidden;flex:none;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;font-weight:700}
.pt img{width:100%;height:100%;object-fit:cover}
.pt[aria-current="true"]{border-color:var(--accent)}
.addp{width:52px;height:64px;border-radius:8px;border:2px dashed var(--line);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.addp svg{width:22px;height:22px}
.ctrl{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.ctrl .seg{flex:1}
.ibtn{min-width:44px;height:36px;border-radius:9px;background:var(--fill);color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0 10px;gap:6px;font-size:14px;font-weight:600}
.ibtn svg{width:20px;height:20px}
.ibtn.danger{color:var(--bad)}
.form{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:16px}
.f{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;position:relative}
.f+.f::before{content:"";position:absolute;left:14px;right:0;top:0;height:1px;background:var(--line)}
.f>label{width:104px;flex:none;color:var(--ink);font-size:16px}
.f input[type=text],.f input[type=date],.f select,.f textarea{flex:1;min-width:0;text-overflow:ellipsis;border:0;background:none;font-size:17px;text-align:right;height:44px;-webkit-appearance:none;appearance:none;color:var(--ink)}
.f input[type=date]{text-align:right;color:var(--ink)}
.f input[type=date]:disabled{opacity:.35}
.f input::placeholder,.f textarea::placeholder{color:var(--muted)}
.f input:focus-visible,.f select:focus-visible,.f textarea:focus-visible{outline:none}
.f textarea{height:auto;min-height:72px;padding:11px 0;resize:none;text-align:left;font-size:16px}
.f.area{align-items:flex-start;flex-direction:column;gap:0;padding-top:6px}
.f.area textarea{width:100%}
.f .sw{flex:1;display:flex;justify-content:flex-end}
.toggle{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.toggle[aria-checked="true"]{background:var(--ok)}
.toggle[aria-checked="true"]::after{transform:translateX(20px)}
.ocr{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.ocr .bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.ocr .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.f[data-auto]>label::after{content:" ✦";color:var(--accent);font-size:12px}
.btnrow{display:flex;gap:10px;margin-bottom:12px}
.big{flex:1;min-height:48px;border-radius:12px;background:var(--card);color:var(--accent);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.big.danger{color:var(--bad)}
.big svg{width:20px;height:20px}
.note{color:var(--muted);font-size:13px;margin:6px 6px 16px}
.hd{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin:18px 6px 6px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,34,40,.94);color:#fff;border-radius:22px;padding:10px 18px;font-size:15px;z-index:60;max-width:88vw;text-align:center;animation:fade .2s}

/* printable list (hidden on screen) */
#printArea{display:none}
@media print{
  body>:not(#printArea){display:none!important}
  #printArea{display:block;color:#000;background:#fff;font:12px/1.35 var(--font);padding:0}
  #printArea h1{font-size:20px;margin:0 0 2px}
  #printArea .sub{color:#555;margin:0 0 14px;font-size:11px}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#555;border-bottom:1.5px solid #000;padding:4px 6px}
  #printArea td{padding:6px;border-bottom:.5px solid #bbb;vertical-align:top}
  #printArea tr{break-inside:avoid}
  #printArea .bad{color:#b00020;font-weight:700} #printArea .warn{color:#a35a00;font-weight:700}
  @page{margin:14mm}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

/* Suggest a category from the document name (and later from scanned text). */
function suggestCat(text) {
  const s = (text || "").toLowerCase();
  if (/imca|dynamic positioning|\bdp\b|dpo|nautical institute/.test(s)) return "imca";
  if (/stcw|safety training|basic training|survival|pscrb|fire ?fight|first aid|medical care|efa\b|gmdss|ecdis|bridge resource|\bbrm\b|ship security|\bssa\b|\bssos\b|tanker|competenc|\bcoc\b|\bgoc\b|advanced fire/.test(s)) return "stcw";
  if (/flag|endorsement|seaman|seafarer|discharge book|sid\b|identity|passport|panama|liberia|marshall|bahamas|malta|cyprus|norway|singapore|registry|maritime administration/.test(s)) return "flag";
  return "other";
}

const MS_DAY = 864e5;
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const daysLeft = iso => iso ? Math.round((new Date(iso + "T00:00:00") - today0()) / MS_DAY) : null;
function status(d) {
  if (d.noExpiry) return { cls: "none", txt: t("st_none"), rank: 4 };
  const n = daysLeft(d.expiry);
  if (n === null) return { cls: "none", txt: t("st_nodate"), rank: 5 };
  if (n < 0) return { cls: "bad", txt: t("st_expired", { n: -n }), rank: 0, n };
  if (n === 0) return { cls: "bad", txt: t("st_expired1"), rank: 0, n };
  if (n <= 90) return { cls: "warn", txt: t("st_soon", { n }), rank: 1, n };

/* ---------- storage (IndexedDB) ---------- */
let dbp = null, mem = new Map(); // mem = fallback if IndexedDB is blocked
function openDB() {
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open("crewvault", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("docs", { keyPath: "id" });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  }).catch(() => null);
  return dbp;
}
async function dbAll() {
  const db = await openDB(); if (!db) return [...mem.values()];
  return new Promise((res, rej) => { const q = db.transaction("docs").objectStore("docs").getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function dbPut(doc) {
  const db = await openDB(); if (!db) { mem.set(doc.id, doc); return; }
  return new Promise((res, rej) => { const tx = db.transaction("docs", "readwrite"); tx.objectStore("docs").put(doc); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}
async function dbDel(id) {
  const db = await openDB(); if (!db) { mem.delete(id); return; }
  return new Promise((res, rej) => { const tx = db.transaction("docs", "readwrite"); tx.objectStore("docs").delete(id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}

/* ---------- scan processing ---------- */
const MAXD = 2200, MAX_PDF_PAGES = 40;
async function loadImage(file) {
  try { return await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch (e) {
    return new Promise((res, rej) => { const img = new Image(); const u = URL.createObjectURL(file); img.onload = () => res(img); img.onerror = rej; img.src = u; });
  }
}
function applyFilter(ctx, w, h, mode) {
  const img = ctx.getImageData(0, 0, w, h), d = img.data, n = w * h;
  const lum = new Uint8Array(n), hist = new Uint32Array(256);
  for (let i = 0, j = 0; i < n; i++, j += 4) { const y = (d[j] * 299 + d[j + 1] * 587 + d[j + 2] * 114) / 1000 | 0; lum[i] = y; hist[y]++; }

    const half = Math.max(8, (Math.min(w, h) / 28) | 0), W1 = w + 1, I = new Uint32Array(W1 * (h + 1));
    for (let y = 0; y < h; y++) { let row = 0; for (let x = 0; x < w; x++) { row += lum[y * w + x]; I[(y + 1) * W1 + x + 1] = I[y * W1 + x + 1] + row; } }
    for (let y = 0; y < h; y++) {
      const y0 = Math.max(0, y - half), y1 = Math.min(h - 1, y + half);
      for (let x = 0; x < w; x++) {
        const x0 = Math.max(0, x - half), x1 = Math.min(w - 1, x + half), area = (x1 - x0 + 1) * (y1 - y0 + 1);
        const sum = I[(y1 + 1) * W1 + x1 + 1] - I[y0 * W1 + x1 + 1] - I[(y1 + 1) * W1 + x0] + I[y0 * W1 + x0];
        const v = lum[y * w + x] * area < sum * 0.9 ? 0 : 255, j = (y * w + x) * 4;
        d[j] = d[j + 1] = d[j + 2] = v;
      }
    }
  } else {
    // stretch levels so paper becomes white and ink stays dark
    let c = 0, lo = 0, hi = 255; const a = n * 0.01, b = n * 0.9;
    for (let v = 0; v < 256; v++) { c += hist[v]; if (c >= a) { lo = v; break; } }
    c = 0; for (let v = 0; v < 256; v++) { c += hist[v]; if (c >= b) { hi = v; break; } }
    if (hi - lo < 30) hi = Math.min(255, lo + 30);
    const g = 255 / (hi - lo), gray = mode === "gray";
    for (let i = 0, j = 0; i < n; i++, j += 4) {
      if (gray) { const v = Math.max(0, Math.min(255, (lum[i] - lo) * g)); d[j] = d[j + 1] = d[j + 2] = v; }
      else for (let k = 0; k < 3; k++) d[j + k] = Math.max(0, Math.min(255, (d[j + k] - lo) * g));
    }
  }

}
function thumbOf(cv) {
  const s = 480 / Math.max(cv.width, cv.height), c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(cv.width * s)); c.height = Math.max(1, Math.round(cv.height * s));

}
async function ensureSrc(p) { if (!p.src && p.origBlob) p.src = await loadImage(p.origBlob); }

function pageCanvas(p, mode) {
  const sw = p.src.naturalWidth || p.src.width, sh = p.src.naturalHeight || p.src.height, k = Math.min(1, MAXD / Math.max(sw, sh));
  const w = Math.round(sw * k), h = Math.round(sh * k), rot = p.rot % 360, swap = rot === 90 || rot === 270;

  const ctx = cv.getContext("2d", { willReadFrequently: true });

  ctx.translate(cv.width / 2, cv.height / 2); ctx.rotate(rot * Math.PI / 180); ctx.drawImage(p.src, -w / 2, -h / 2, w, h);

async function renderPage(p) {
  await ensureSrc(p);

  p.blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.86));
  p.type = "image/jpeg"; p.thumb = thumbOf(cv);
  if (p.url) URL.revokeObjectURL(p.url);
  p.url = URL.createObjectURL(p.blob);

        ed.cur = ed.pages.length - 1;
      } catch (e) { console.error(e); }
    }
    ed.busy = false; drawPages();
    if (ocrEnabled() && !ed.ocrTried && ed.pages.some(pg => pg.origBlob)) { ed.ocrTried = true; runOcr(); }
  }
  async function save() {
    const name = q("#eName").value.trim();
    if (!name) { toast(t("nameRequired")); q("#eName").focus(); return; }
    if (ed.busy) return;
    const noExp = q("#eNoExp").getAttribute("aria-checked") === "true";
    const out = {
      id: ed.id, created: ed.created, updated: Date.now(), name, cat: q("#eCat").value, number: q("#eNum").value.trim(), issued: q("#eIss").value,
      expiry: noExp ? "" : q("#eExp").value, noExpiry: noExp, issuer: q("#eBy").value.trim(), notes: q("#eNotes").value.trim(),
      pages: ed.pages.map(p => ({ blob: p.blob, type: p.type, thumb: p.thumb || null })), thumb: (ed.pages[0] && ed.pages[0].thumb) || null
    };
    await dbPut(out);
    const i = docs.findIndex(d => d.id === out.id); if (i >= 0) docs[i] = out; else docs.push(out);
    doClose(); render(); toast(t("saved"));
  }
  drawPages();
  if (startFiles.length) await addFiles(startFiles);
}

/* ---------- share / download ---------- */
const slug = s => (s || "document").replace(/[^\w\-. ]+/g, "").trim().replace(/\s+/g, "_").slice(0, 60) || "document";
const extOf = type => type === "application/pdf" ? "pdf" : "jpg";
async function docToPdf(d) {
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const put = x => { const u = typeof x === "string" ? enc.encode(x) : x; parts.push(u); len += u.length; };
  const n = d.pages.length, dims = [];
  for (const pg of d.pages) { const bm = await createImageBitmap(pg.blob); dims.push([bm.width, bm.height]); bm.close(); }
  put("%PDF-1.4\n");
  const obj = (id, body) => { offs[id] = len; put(id + " 0 obj\n" + body + "\nendobj\n"); };
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, "<< /Type /Pages /Count " + n + " /Kids [" + d.pages.map((_, i) => (3 + 3 * i) + " 0 R").join(" ") + "] >>");
  for (let i = 0; i < n; i++) {
    const [w, h] = dims[i], k = 842 / Math.max(w, h), W = (w * k).toFixed(2), H = (h * k).toFixed(2), jpg = new Uint8Array(await d.pages[i].blob.arrayBuffer());
    obj(3 + 3 * i, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + W + " " + H + "] /Resources << /XObject << /Im0 " + (5 + 3 * i) + " 0 R >> >> /Contents " + (4 + 3 * i) + " 0 R >>");
    const c = "q " + W + " 0 0 " + H + " 0 0 cm /Im0 Do Q";
    obj(4 + 3 * i, "<< /Length " + c.length + " >>\nstream\n" + c + "\nendstream");
    offs[5 + 3 * i] = len;
    put((5 + 3 * i) + " 0 obj\n<< /Type /XObject /Subtype /Image /Width " + w + " /Height " + h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpg.length + " >>\nstream\n"); put(jpg); put("\nendstream\nendobj\n");
  }
  const total = 3 + 3 * n, xref = len;
  put("xref\n0 " + total + "\n0000000000 65535 f \n");
  for (let i = 1; i < total; i++) put(String(offs[i]).padStart(10, "0") + " 00000 n \n");
  put("trailer\n<< /Size " + total + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF\n");
  return new Blob(parts, { type: "application/pdf" });
}
async function filesOf(ids) {
  const out = [];
  for (const id of ids) {
    const d = docs.find(x => x.id === id); if (!d || !d.pages.length) continue;
    const base = slug(d.name + (d.number ? "_" + d.number : ""));
    if (d.pages.every(p => p.type !== "application/pdf")) {
      try { out.push(new File([await docToPdf(d)], base + ".pdf", { type: "application/pdf" })); continue; } catch (e) { console.error(e); }
    }
    d.pages.forEach((p, i) => out.push(new File([p.blob], base + (d.pages.length > 1 ? "_p" + (i + 1) : "") + "." + extOf(p.type), { type: p.type })));
  }
  return out;
}
async function download(files) {
  for (const f of files) { const u = URL.createObjectURL(f), a = document.createElement("a"); a.href = u; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); await sleep(350); }
}
async function shareFiles(files, title) {
  if (!files.length) { toast(t("nothing")); return; }
  try {
    if (navigator.canShare && navigator.canShare({ files })) { await navigator.share({ files, title }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  await download(files); toast(t("shareFail"));
}
const shareDocs = async ids => shareFiles(await filesOf(ids), "CrewVault");

/* ---------- print / PDF list ---------- */
function printList() {
  const list = visibleDocs(), pa = $("#printArea");
  pa.innerHTML = `<h1>${esc(t("printTitle"))}</h1><p class="sub">${esc(t("printed"))}: ${esc(new Date().toLocaleDateString(getLang() === "pl" ? "pl-PL" : "en-GB", { day: "2-digit", month: "long", year: "numeric" }))} · ${list.length}</p>` +
    `<table><thead><tr><th>${esc(t("c_cat"))}</th><th>${esc(t("c_doc"))}</th><th>${esc(t("c_no"))}</th><th>${esc(t("c_issued"))}</th><th>${esc(t("c_exp"))}</th><th>${esc(t("c_by"))}</th><th>${esc(t("c_status"))}</th></tr></thead><tbody>` +
    list.map(d => { const st = status(d); return `<tr><td>${esc(catName(d.cat))}</td><td>${esc(d.name)}</td><td>${esc(d.number)}</td><td>${esc(fmtDate(d.issued))}</td><td>${d.noExpiry ? "—" : esc(fmtDate(d.expiry))}</td><td>${esc(d.issuer)}</td><td class="${st.cls === "bad" ? "bad" : st.cls === "warn" ? "warn" : ""}">${esc(st.txt)}</td></tr>`; }).join("") +
    `</tbody></table>`;
  setTimeout(() => window.print(), 50);
}

/* ---------- settings & backup ---------- */
const blobToData = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function exportBackup() {
  const items = [];
  for (const d of docs) items.push({ ...d, pages: await Promise.all(d.pages.map(async p => ({ type: p.type, thumb: p.thumb, data: await blobToData(p.blob) }))) });
  const file = new File([JSON.stringify({ app: "crewvault", v: 1, docs: items })], "CrewVault-backup-" + new Date().toISOString().slice(0, 10) + ".json", { type: "application/json" });
  await shareFiles([file], "CrewVault backup");
}
async function importBackup(file) {
  try {
    const j = JSON.parse(await file.text()); if (j.app !== "crewvault" || !Array.isArray(j.docs)) throw 0;
    for (const d of j.docs) {
      const pages = await Promise.all(d.pages.map(async p => ({ type: p.type, thumb: p.thumb, blob: await (await fetch(p.data)).blob() })));
      const doc = { ...d, pages }; await dbPut(doc); const i = docs.findIndex(x => x.id === doc.id); if (i >= 0) docs[i] = doc; else docs.push(doc);
    }
    render(); toast(t("imported", { n: j.docs.length }));
  } catch (e) { toast(t("importFail")); }
}
function openSettings() {
  const sh = openSheet({ title: t("settings"), right: { text: t("done"), fn: () => sh.close(), bold: true }, body: api => {
    api.body.innerHTML =
      `<div class="hd">${esc(t("ocrSetting"))}</div><div class="form"><div class="f"><label id="lOcr" style="width:auto">${esc(t("ocrSetting"))}</label><div class="sw"><button class="toggle" id="sOcr" role="switch" aria-checked="${ocrEnabled()}" aria-labelledby="lOcr"></button></div></div></div><div class="note" style="margin-top:-8px">${esc(t("ocrNote"))}</div>` +
      `<div class="hd">${esc(t("backup"))}</div><div class="btnrow"><button class="big" id="sExp">${esc(t("exportBackup"))}</button><button class="big" id="sImp">${esc(t("importBackup"))}</button></div><div class="note">${esc(t("backupNote"))}</div>` +
      `<div class="hd">${esc(t("privacy"))}</div><div class="note" style="margin-top:0">${esc(t("privacyText"))}</div>` +
      `<div class="hd">${esc(t("storage"))}</div><div class="note" style="margin-top:0">${esc(t("storageText", { n: docs.length }))}</div>`;
    api.body.querySelector("#sOcr").onclick = e => { const on = e.currentTarget.getAttribute("aria-checked") !== "true"; e.currentTarget.setAttribute("aria-checked", String(on)); lsSet("crewvault.ocr", on ? "1" : "0"); };
    api.body.querySelector("#sExp").onclick = () => exportBackup();
    api.body.querySelector("#sImp").onclick = () => { const i = $("#inBackup"); i.value = ""; i.onchange = () => i.files[0] && importBackup(i.files[0]); i.click(); };
  }});
}

/* ---------- share menu & language menu ---------- */
function shareMenu() {
  const all = docs.map(d => d.id), shown = visibleDocs().map(d => d.id), items = [];
  if (all.length) items.push({ icon: SVG.share, text: t("shareAllN", { n: all.length }), fn: () => shareDocs(all) });
  if (shown.length && shown.length !== all.length) items.push({ icon: SVG.share, text: t("shareShown", { n: shown.length }), fn: () => shareDocs(shown) });
  if (all.length) items.push({ icon: ICON_CHECK, text: t("selectDocs"), fn: () => { selecting = true; selected.clear(); render(); } });
  if (!items.length) { toast(t("nothing")); return; }
  actionSheet(items);
}
function langMenu() {
  const cur = lsGet("crewvault.lang") || "auto", mk = (v, n) => ({ text: (cur === v ? "✓ " : "") + n, fn: () => { lsSet("crewvault.lang", v); render(); } });
  actionSheet([mk("pl", "Polski"), mk("en", "English"), mk("auto", t("auto"))]);
}

/* ---------- wire up ---------- */
$("#fab").onclick = addMenu;
$("#q").addEventListener("input", e => { query = e.target.value; render(); });
$("#sort").addEventListener("change", e => { sortBy = e.target.value; lsSet("crewvault.sort", sortBy); render(); });
$("#bSelect").onclick = () => { selecting = !selecting; selected.clear(); render(); };
$("#selAll").onclick = () => { const l = visibleDocs(); if (selected.size === l.length) selected.clear(); else l.forEach(d => selected.add(d.id)); render(); };
$("#selShare").onclick = () => shareDocs([...selected]);
$("#bPrint").onclick = printList;
$("#bShare").onclick = shareMenu;
$("#bLang").onclick = langMenu;
$("#bSet").onclick = openSettings;
$("#dens").onclick = () => { dense = !dense; lsSet("crewvault.dense", dense ? "1" : "0"); render(); };
let rzT = null, lastCols = 0;
addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { const c = Math.floor(innerWidth / 150); if (c !== lastCols) { lastCols = c; render(); } }, 150); });
addEventListener("scroll", () => $("#nav").classList.toggle("scrolled", scrollY > 38), { passive: true });
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheetStack.length) sheetStack[sheetStack.length - 1].ov.dispatchEvent(new MouseEvent("mousedown", { bubbles: false })); });
(async () => {
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  try { docs = await dbAll(); } catch (e) { docs = []; }
  render();
})();
</script>
